version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - run:
          name: Compile Project (.JAR)
          command: mvn package -DskipTests

  tests:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - run:
          name: Run JUnit Tests
          command: mvn test

  docker-push:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Artifact
          command: mvn package -DskipTests
      - run:
          name: Build Docker Image
          command: docker build -f docker/dockerfiles/Dockerfile -t $DOCKERHUB_USERNAME/contacts:latest .
      - run:
          name: DockerHub Login
          command: echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin
      - run:
          name: Sending to DockerHub
          command: docker push $DOCKERHUB_USERNAME/contacts:latest

workflows:
  pipeline:
    jobs:
      - build
      - tests:
          requires:
            - build
      - docker-push:
          requires:
            - tests
          filters:
            branches:
              only:
                - main
