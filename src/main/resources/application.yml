server:
  port: 8000

spring:
  application:
    name: RESTful API Contacts
    description: Contacts REST API developed with Spring Boot

  security:
    user:
      email: admin@admin.com
      name: admin
      password: admin

  datasource:
    url: jdbc:postgresql://localhost:5432/contactsDatabase
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
